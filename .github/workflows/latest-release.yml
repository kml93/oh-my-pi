name: Publish Latest Release

on:
  push:
    branches:
      - kml93
  workflow_dispatch:

# Serialize deploys: two rapid kml93 pushes must not publish the rolling
# latest release concurrently (lost updates / interleaved failures).
concurrency:
  group: latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build standalone ${{ matrix.target }} binary
    # 22.04 (not latest): glibc 2.35 instead of 2.39 — the produced ELF and
    # its embedded addon stay loadable on older glibc machines.
    runs-on: ${{ matrix.runner }}
    strategy:
      # One broken target must not keep the other from being published.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          # Termux (Android aarch64) runs this glibc ELF through glibc-runner
          # (`grun`); built natively so the smoke test exercises the real binary.
          - target: linux-arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---- Prebuilt native addons from npm (no Rust toolchain, no bazel) ----
      # This fork never modifies the Rust sources, so it reuses the published
      # release addons exactly like upstream PR CI does (ci.yml native_addons).
      # Pinned to the workspace's own natives version — NOT @latest:
      # embed-native.ts stamps the embedded manifest with the LOCAL
      # packages/natives version and the runtime loader enforces that version
      # sentinel, so a mismatched pair would only explode at dlopen time on
      # the machine that installed the binary.
      # x64 ships modern + baseline addons, arm64 a single default addon.
      - name: Fetch prebuilt native addons (npm)
        run: |
          set -euo pipefail
          natives_version=$(bun -p "require('./packages/natives/package.json').version")
          package="@oh-my-pi/pi-natives-${{ matrix.target }}@${natives_version}"
          echo "Fetching ${package}"
          tarball="$(bun info "$package" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/package/pi_natives.${{ matrix.target }}*.node packages/natives/native/

      # A corrupt download must fail here, not as a confusing dlopen error in
      # the binary smoke test below or on an end machine (pattern: ci.yml).
      - name: Smoke native addons
        run: |
          set -euo pipefail
          # `bun -e 'require("./x.node")'` swallows dlopen failures (exit 0 on
          # a bogus addon); a script file enforces them.
          cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
          for (const f of process.argv.slice(2)) {
            const m = require(f);
            if (!m || Object.keys(m).length === 0) {
              console.error(`addon failed to load: ${f}`);
              process.exit(1);
            }
          }
          EOF
          # Absolute paths: require() inside the script resolves relative
          # paths against the script's own directory ($RUNNER_TEMP), not cwd.
          bun "$RUNNER_TEMP/smoke-addons.js" "$PWD"/packages/natives/native/pi_natives.${{ matrix.target }}*.node

      - name: Build standalone ELF binary
        run: bun --cwd=packages/coding-agent run build

      # Never deploy a broken ELF: the smoke probe re-enters the CLI entrypoint,
      # spawns the stats sync worker and the tiny-model subprocess, and pings
      # the runtime-extracted embedded addon end to end (upstream release jobs
      # run the same isolated-HOME pattern).
      - name: Smoke test binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/dist/omp --smoke-test

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-${{ matrix.target }}
          path: packages/coding-agent/dist/omp
          # Only the publish job of this run reads it.
          retention-days: 1
          if-no-files-found: error

  # GitHub hard-rejects files over 100 MB in git refs (the omp ELF is
  # ~260 MB) and bun cannot install remote tarball URLs, so the binaries
  # ship as assets of one rolling Release (2 GB per-file limit). A single
  # publisher avoids racing two builds on the same release. The lightweight
  # `latest` tag moves to the built SHA and the asset URLs stay stable:
  #   https://github.com/kml93/oh-my-pi/releases/download/latest/omp-linux-x64
  #   https://github.com/kml93/oh-my-pi/releases/download/latest/omp-linux-arm64
  publish:
    name: Publish rolling latest release
    needs: build
    # Publish whichever targets built; a failed one keeps its previous asset.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omp-*
          path: artifacts

      - name: Prepare distribution payload
        run: |
          set -euo pipefail
          for dir in artifacts/omp-*; do
            cp "$dir/omp" "$(basename "$dir")"
            chmod +x "$(basename "$dir")"
          done
          ls omp-*

      - name: Publish rolling latest tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" refs/tags/latest
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "omp latest (kml93 rolling)" \
              --notes "Rolling standalone builds of kml93, rebuilt on every push. Native addons are embedded — download omp-linux-x64 or omp-linux-arm64 (Termux: run through grun), chmod +x, done."
          gh release upload latest omp-* LICENSE THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
