name: Deploy Dist Branch

on:
  push:
    branches:
      - kml93
  workflow_dispatch:

# Serialize dist deploys: two rapid kml93 pushes must not force-push the dist
# branch concurrently (lost updates / interleaved failures).
concurrency:
  group: dist-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build standalone binary & deploy to dist
    # 22.04 (not latest): glibc 2.35 instead of 2.39 — the produced ELF and
    # its embedded addon stay loadable on older glibc machines.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---- Prebuilt native addons from npm (no Rust toolchain, no bazel) ----
      # This fork never modifies the Rust sources, so it reuses the published
      # release addons exactly like upstream PR CI does (ci.yml native_addons).
      # Pinned to the workspace's own natives version — NOT @latest:
      # embed-native.ts stamps the embedded manifest with the LOCAL
      # packages/natives version and the runtime loader enforces that version
      # sentinel, so a mismatched pair would only explode at dlopen time on
      # the machine that installed the dist branch.
      - name: Fetch prebuilt native addons (npm)
        run: |
          set -euo pipefail
          natives_version=$(node -p "require('./packages/natives/package.json').version")
          echo "Fetching @oh-my-pi/pi-natives-linux-x64@${natives_version}"
          tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@${natives_version}" dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/

      # A corrupt download must fail here, not as a confusing dlopen error in
      # the binary smoke test below or on an end machine (pattern: ci.yml).
      - name: Smoke native addons
        run: |
          set -euo pipefail
          # `bun -e 'require("./x.node")'` swallows dlopen failures (exit 0 on
          # a bogus addon); a script file enforces them.
          cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
          for (const f of process.argv.slice(2)) {
            const m = require(f);
            if (!m || Object.keys(m).length === 0) {
              console.error(`addon failed to load: ${f}`);
              process.exit(1);
            }
          }
          EOF
          # Absolute paths: require() inside the script resolves relative
          # paths against the script's own directory ($RUNNER_TEMP), not cwd.
          bun "$RUNNER_TEMP/smoke-addons.js" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-modern.node" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-baseline.node"

      - name: Build standalone ELF binary
        run: bun --cwd=packages/coding-agent run build

      # Never deploy a broken ELF: the smoke probe re-enters the CLI entrypoint,
      # spawns the stats sync worker and the tiny-model subprocess, and pings
      # the runtime-extracted embedded addon end to end (upstream release jobs
      # run the same isolated-HOME pattern).
      - name: Smoke test binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/dist/omp --smoke-test

      - name: Prepare distribution payload
        run: |
          mkdir -p dist-payload
          cp packages/coding-agent/dist/omp dist-payload/omp
          chmod +x dist-payload/omp
          cp LICENSE dist-payload/LICENSE
          cp THIRD-PARTY-NOTICES.txt dist-payload/THIRD-PARTY-NOTICES.txt

          VERSION=$(node -p "require('./packages/coding-agent/package.json').version")

          # Build-metadata suffix makes every dist rebuild a distinct version:
          # bun's global install cache cannot silently serve a stale copy.
          cat <<EOF > dist-payload/package.json
          {
            "name": "oh-my-pi",
            "version": "${VERSION}+dist.${GITHUB_SHA::7}",
            "description": "omp coding agent - standalone linux-x64 distribution",
            "license": "MIT",
            "type": "module",
            "os": ["linux"],
            "cpu": ["x64"],
            "bin": {
              "omp": "./omp"
            },
            "files": [
              "omp",
              "LICENSE",
              "THIRD-PARTY-NOTICES.txt"
            ]
          }
          EOF

          cat <<EOF > dist-payload/README.md
          # oh-my-pi (distribution branch)

          Standalone pre-compiled distribution for \`omp\` (linux-x64, glibc).
          Native addons are embedded in the binary — nothing else to install.

          ## Installation

          \`\`\`bash
          bun install --global github:kml93/oh-my-pi#dist
          \`\`\`

          Version \`${VERSION}+dist.${GITHUB_SHA::7}\` — built from commit \`${GITHUB_SHA}\`.
          EOF

      - name: Deploy to dist branch
        run: |
          cd dist-payload
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(dist): update standalone omp binary [${GITHUB_SHA::7}]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
